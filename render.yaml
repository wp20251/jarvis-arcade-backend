services:
  - type: web
    name: antispier-arcade
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        value: https://www.antispier.com,https://antispier.com
      - key: ARENA_DB
        value: /var/data/arena.db
      - key: SHOPIFY_SECRET
        sync: false
    disk:
      name: arcade-data
      mountPath: /var/data
      sizeGB: 1
